$mod = SUPER
$terminal = alacritty
$menu = rofi -show drun

exec-once = waybar >/tmp/waybar.log 2>&1
exec-once = xfsettingsd
exec-once = mkdir -p /home/parth/GoogleDrive
exec-once = rclone mount gdrive: /home/parth/GoogleDrive --vfs-cache-mode writes --daemon
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = dunst
windowrule = match:class Thunar, opacity 0.55 0.55

#music
windowrule = match:class ^(tauonmb)$, opacity 0.88 0.82

#clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Wallpaper
exec-once = /home/parth/.local/bin/set-wallpaper
bind = $mod SHIFT, W, exec, /home/parth/.local/bin/set-wallpaper

# Eww desktop widget system
exec-once = eww daemon
exec-once = sh -c "sleep 1 && eww open witcher"
bind = $mod, W, exec, eww open --toggle witcher

# Sleep / wake handler
exec-once = hypridle

bind = $mod SHIFT, Q, exec, /home/parth/.local/bin/powermenu
bind = $mod, Q, exec, $terminal
bind = $mod, Return, exec, $terminal
bind = $mod, R, exec, $menu
bind = $mod, D, exec, rofi -show drun
bind = $mod, E, exec, Thunar
bind = $mod, B, exec, /home/parth/Applications/helium.AppImage
bind = $mod, F, fullscreen
bind = $mod, Space, togglefloating
bind = $mod, C, killactive
bind = $mod, M, exit
bind = $mod, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86KbdBrightnessUp, exec, brightnessctl --device='smc::kbd_backlight' set +10%
bind = , XF86KbdBrightnessDown, exec, brightnessctl --device='smc::kbd_backlight' set 10%-
# Focus windows with Super + Arrow
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
# Move active window around with Super + Shift + Arrow
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
# Resize active window with Super + Ctrl + Arrow
bind = $mod CTRL, left, resizeactive, -40 0
bind = $mod CTRL, right, resizeactive, 40 0
bind = $mod CTRL, up, resizeactive, 0 -40
bind = $mod CTRL, down, resizeactive, 0 40
# Move and resize windows with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
# Minimize-like behavior using special workspace
bind = $mod, H, movetoworkspacesilent, special:minimized
bind = $mod, Tab, togglespecialworkspace, minimized
# Switch workspace with Super + number
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
# Move active window to workspace with Super + Shift + number
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
# Previous/next workspace
bind = $mod ALT, right, workspace, e+1
bind = $mod ALT, left, workspace, e-1
# Move between workspaces with Super + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
#Clipboard
bind = $mod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
#lockscreen
bind = $mod, L, exec, /home/parth/.local/bin/smart-lock

input {
       kb_layout = us
       
       touchpad {
             natural_scroll = true
             drag_lock = false
             disable_while_typing = true
             scroll_factor = 0.8
             tap-to-click = true
             clickfinger_behavior = true
       }
       
       sensitivity = -0.3
       accel_profile = fla
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(c8cdd2ff)
    col.inactive_border = rgba(3b4048ff)
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
decoration {
    rounding = 6

    active_opacity = 0.94
    inactive_opacity = 0.84
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000099)
    }
}

animations {
    enabled = false

    bezier = smooth, 0.25, 0.1, 0.25, 1.0

    animation = windows, 1, 4, smooth
    animation = border, 1, 4, smooth
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth
}
