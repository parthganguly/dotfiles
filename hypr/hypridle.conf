general {
    lock_cmd = /home/parth/.local/bin/smart-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /home/parth/.local/bin/set-wallpaper && hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
