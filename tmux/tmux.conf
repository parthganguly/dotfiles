set -g mouse on
set -g history-limit 10000
set -g status-position bottom
set -g status-interval 5

set -g status-style bg=#111316,fg=#A0A4AA
set -g status-left "#[fg=#E6E6E6,bold] #S "
set -g status-right "#[fg=#A0A4AA] %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#FFFFFF,bg=#2A2F36,bold] #I:#W "

set -g pane-border-style fg=#3B4048
set -g pane-active-border-style fg=#C8CDD2
